# Mastermind Minecraft Server Manager — full stack
# Usage (production): docker compose up -d
# Usage (dev):        docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Copy .env.example to .env and set secrets before first run.
#
# Minecraft path notes:
# - Game hosts run the Go agent locally and talk to the control plane over HTTPS.
# - Enable RCON in server.properties (enable-rcon=true, rcon.port, rcon.password).
# - Agent discovery reads server.properties; telnet_* instance fields store RCON credentials.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastermind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mastermind}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastermind} -d ${POSTGRES_DB:-mastermind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ../control-plane
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mastermind}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mastermind}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_AGENT_SECRET: ${JWT_AGENT_SECRET:-change-me-in-production}
      PLAYER_JWT_SECRET: ${PLAYER_JWT_SECRET:-${JWT_SECRET:-change-me-in-production}}
      PLAYER_PORTAL_SERVER_ID: ${PLAYER_PORTAL_SERVER_ID:-}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-${JWT_SECRET:-change-me-in-production}}
      OPENAI_KEY_ENCRYPTION_SECRET: ${OPENAI_KEY_ENCRYPTION_SECRET:-${JWT_SECRET:-change-me-in-production}}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:-${JWT_SECRET:-change-me-in-production}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PRISMACORE_WEB_URL: ${PRISMACORE_WEB_URL:-}
      PRISMACORE_API_USER: ${PRISMACORE_API_USER:-}
      PRISMACORE_API_PASSWORD: ${PRISMACORE_API_PASSWORD:-}
      SEVENDTD_WEB_URL: ${SEVENDTD_WEB_URL:-http://host.docker.internal:8080}
      SEVENDTD_WEB_API_TOKEN_NAME: ${SEVENDTD_WEB_API_TOKEN_NAME:-mastermind}
      SEVENDTD_WEB_API_SECRET: ${SEVENDTD_WEB_API_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      MOD_UPLOAD_DIR: /var/lib/mastermind/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mod_uploads:/var/lib/mastermind/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: runner
      args:
        # Browsers call this URL directly — must be reachable from the user's machine.
        NEXT_PUBLIC_CONTROL_PLANE_URL: ${NEXT_PUBLIC_CONTROL_PLANE_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PROFILE_EDITOR_INTERNAL_URL: http://profile-editor:8000
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:3001
      PLAYER_SESSION_SECRET: ${PLAYER_SESSION_SECRET:-${JWT_SECRET:-change-me-in-production}}
      PLAYER_PORTAL_SERVER_ID: ${PLAYER_PORTAL_SERVER_ID:-}
      # Local installs use the Docker host; split-host deployments can point
      # these at the game host's private WireGuard address.
      SEVENDTD_WEB_URL: ${SEVENDTD_WEB_URL:-http://host.docker.internal:8080}
      SEVENDTD_WEB_API_TOKEN_NAME: ${SEVENDTD_WEB_API_TOKEN_NAME:-mastermind}
      SEVENDTD_WEB_API_SECRET: ${SEVENDTD_WEB_API_SECRET:-}
      SEVENDTD_TELNET_HOST: ${SEVENDTD_TELNET_HOST:-host.docker.internal}
      SEVENDTD_TELNET_PORT: ${SEVENDTD_TELNET_PORT:-18081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/7dtd/userdata/Saves/Rotterdam/Builder/map:/7dtd-map:ro
      - /opt/7dtd/userdata/Saves/Rotterdam/Builder:/7dtd-save:ro
      - /opt/7dtd/userdata/GeneratedWorlds/Rotterdam/map_info.xml:/7dtd-world/map_info.xml:ro
      - /opt/7dtd/logs/server.log:/7dtd-logs/server.log:ro
      - /opt/7dtd/server/Data/ItemIcons:/7dtd-item-icons:ro
    depends_on:
      control-plane:
        condition: service_healthy
      profile-editor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Outbound-only public HTTPS ingress for Mastermind. The remotely managed
  # tunnel token lives in a root-owned, gitignored file and is not exposed in
  # the container command line or environment.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0:0"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      web:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  # Makes host-loopback-only 7DTD telnet reachable solely through Docker's
  # bridge address. Port 18081 is not bound to a LAN or public interface.
  telnet-relay:
    image: alpine/socat:1.8.0.3
    network_mode: host
    restart: unless-stopped
    command: ["TCP-LISTEN:18081,bind=172.17.0.1,reuseaddr,fork", "TCP:127.0.0.1:8081"]

  profile-editor:
    build:
      context: ../integrations/7d2d-profile-editor
      args:
        UPSTREAM_COMMIT: 270f998adf70f3724afd93ba0e08569e3ba78c95
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8000); exit($$s?0:1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  discord-bot:
    profiles: ["discord-bot"]
    build:
      context: ../discord-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ALLOWED_ROLE_IDS: ${DISCORD_ALLOWED_ROLE_IDS:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      DISCORD_EPHEMERAL_REPLIES: ${DISCORD_EPHEMERAL_REPLIES:-true}
      MASTERMIND_URL: ${MASTERMIND_URL:-http://control-plane:3001}
      MASTERMIND_EMAIL: ${MASTERMIND_EMAIL:-}
      MASTERMIND_PASSWORD: ${MASTERMIND_PASSWORD:-}
      MASTERMIND_ORG_ID: ${MASTERMIND_ORG_ID:-}
      MASTERMIND_SERVER_ID: ${MASTERMIND_SERVER_ID:-}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-600}
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mod_uploads:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
